<!doctype html>
<html lang="pt-BR" data-tema="azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78c0">
<title>Baixador</title>
<style>
  :root {
    --vidro: rgba(112, 180, 245, .42);
    --vidro-forte: rgba(70, 140, 215, .62);
    --borda-ext: rgba(20, 60, 110, .75);
    --acento: #2c7fc9;
    --titulo-texto: #0b1c33;
    --fonte: "Segoe UI", system-ui, -apple-system, Roboto, Tahoma, sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html[data-tema="roxo"] {
    --vidro: rgba(196, 150, 232, .5);
    --vidro-forte: rgba(140, 90, 190, .68);
    --borda-ext: rgba(70, 30, 110, .75);
    --acento: #8a55b8;
  }
  html[data-tema="verde"] {
    --vidro: rgba(130, 216, 150, .45);
    --vidro-forte: rgba(60, 150, 90, .66);
    --borda-ext: rgba(20, 80, 40, .75);
    --acento: #3a9a58;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--fonte);
    font-size: 15px;
    color: #1a1a1a;
    background: #2a78c0;
    overflow-x: hidden;
  }
  [hidden] { display: none !important; }

  /* ---------- cenário ---------- */
  .cenario { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

  /* ---------- área principal ---------- */
  .area {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 250px minmax(0, 700px);
    gap: 22px;
    justify-content: center;
    align-items: start;
    padding: 28px 16px calc(84px + var(--safe-b));
    min-height: 100%;
  }
  .janelas { min-width: 0; }

  /* ---------- gadgets ---------- */
  .gadgets { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 28px; }
  .gadget {
    color: #fff;
    border-radius: 9px;
    padding: 12px 14px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,.10) 55%), var(--vidro);
    backdrop-filter: blur(12px) saturate(1.5);
    -webkit-backdrop-filter: blur(12px) saturate(1.5);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 6px 22px rgba(0,30,90,.35), inset 0 0 0 1px rgba(255,255,255,.25);
    text-shadow: 0 1px 3px rgba(0,30,80,.7);
  }
  .gadget h2 { margin: 0 0 8px; font-size: 15px; font-weight: 400; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,.4); }
  .gadget ul { list-style: none; margin: 0; padding: 0; }
  .gadget li button {
    all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 7px 8px; border-radius: 4px; cursor: pointer; font-size: 14px;
  }
  .gadget li button:hover { background: rgba(255,255,255,.25); box-shadow: inset 0 0 0 1px rgba(255,255,255,.5); }
  .gadget li button[aria-current="true"] { background: rgba(255,255,255,.32); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
  .gadget li button:focus-visible { outline: 2px solid #fff; }
  .gadget svg.ic { width: 22px; height: 22px; flex: none; filter: drop-shadow(0 1px 2px rgba(0,30,80,.5)); }
  .relogio { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .relogio svg { width: 120px; height: 120px; }
  .relogio .hora { font-size: 20px; }
  .relogio .data { font-size: 12px; opacity: .95; }
  .sistema .linha { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 3px 0; }
  .sistema .ok::before, .sistema .no::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .sistema .ok::before { background: #5dff7a; box-shadow: 0 0 6px #5dff7a; }
  .sistema .no::before { background: #ffb347; box-shadow: 0 0 6px #ffb347; }

  /* ---------- janela estilo Aero ---------- */
  .janela {
    border-radius: 9px;
    padding: 0 8px 8px;
    background: linear-gradient(180deg, rgba(255,255,255,.62) 0, rgba(255,255,255,.2) 44px, rgba(255,255,255,.12) 100%), var(--vidro);
    backdrop-filter: blur(14px) saturate(1.6);
    -webkit-backdrop-filter: blur(14px) saturate(1.6);
    border: 1px solid var(--borda-ext);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 12px 40px rgba(0,25,70,.5), 0 2px 6px rgba(0,0,0,.3);
  }
  .titulo { display: flex; align-items: center; gap: 8px; height: 32px; padding-left: 4px; }
  .titulo .ico { width: 18px; height: 18px; flex: none; }
  .titulo .nome {
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--titulo-texto); font-size: 15px;
    text-shadow: 0 0 10px #fff, 0 0 5px #fff, 0 0 2px #fff;
  }
  .caixas { display: flex; align-self: flex-start; margin-right: -2px; }
  .cx {
    width: 28px; height: 19px; display: grid; place-items: center; font-size: 12px; line-height: 1; color: #1b2c40; font-weight: 700;
    background: linear-gradient(rgba(255,255,255,.85), rgba(200,220,240,.55) 50%, rgba(150,185,220,.5) 52%, rgba(200,225,245,.7));
    border: 1px solid rgba(40,70,110,.7); border-top: 0; border-left-width: 0;
  }
  .cx:first-child { border-left-width: 1px; border-bottom-left-radius: 5px; }
  .cx.fechar {
    width: 46px; color: #fff; border-bottom-right-radius: 5px;
    background: linear-gradient(#efb2a2, #d9593c 45%, #bd2c0f 50%, #dc6f50);
    text-shadow: 0 0 3px rgba(80,0,0,.7);
  }
  .cliente {
    background: linear-gradient(#ffffff, #f4f7fb);
    border: 1px solid #5d7390;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.9);
    padding: 18px 20px 14px;
    border-radius: 2px;
  }
  .cliente h1 { margin: 0; font-size: 22px; font-weight: 400; color: #1e3287; line-height: 1.2; }
  .cliente p.sub { margin: 4px 0 16px; color: #5a6470; font-size: 14px; }
  .rotulo { display: block; font-size: 13px; color: #333; margin-bottom: 4px; }

  .endereco { display: flex; gap: 6px; }
  .endereco input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 7px 9px;
    border: 1px solid #abadb3; border-top-color: #8e8f8f; border-left-color: #b8b9bd; border-radius: 2px;
    background: #fff; color: #111;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.12);
  }
  .endereco input:focus { outline: none; border-color: #3c7fb1; box-shadow: 0 0 0 2px rgba(80,170,240,.45); }
  .acoes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

  .btn {
    font: inherit; color: #000; cursor: pointer; min-height: 34px; padding: 5px 18px;
    border: 1px solid #707070; border-radius: 3px;
    background: linear-gradient(#f4f4f4 0 46%, #ebebeb 46% 50%, #d1d1d1 50% 100%);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.85);
  }
  @media (hover: hover) {
    .btn:hover:not(:disabled) { border-color: #3c7fb1; background: linear-gradient(#eaf6fd 0 46%, #d9f0fc 46% 50%, #bee6fd 50% 100%); }
  }
  .btn:active:not(:disabled) { border-color: #2c628b; background: linear-gradient(#e5f4fc 0 46%, #c4e5f6 46% 50%, #98d1ef 50% 100%); }
  .btn.principal { border-color: #3c7fb1; box-shadow: inset 0 0 0 1px #aee2fb, 0 0 4px rgba(60,127,177,.55); }
  .btn:disabled { color: #838383; border-color: #adb2b5; background: #f4f4f4; cursor: default; box-shadow: none; }
  .btn:focus-visible { outline: 2px solid #1a73e8; outline-offset: 2px; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }

  .preview {
    display: flex; gap: 12px; align-items: center; margin-top: 16px; padding: 10px;
    border: 1px solid #d3dce8; background: #f6f9fd; border-radius: 3px;
  }
  .preview img { width: 112px; height: 63px; object-fit: cover; border-radius: 2px; border: 1px solid #b9c5d4; background: #dfe7f0; flex: none; }
  .preview.quadrado img { width: 72px; height: 72px; }
  .preview .tx { min-width: 0; }
  .preview .t { font-size: 15px; color: #1e3287; overflow-wrap: anywhere; }
  .preview .m { font-size: 13px; color: #5a6470; margin-top: 2px; }

  fieldset.opcoes { margin: 14px 0 0; padding: 8px 14px 12px; border: 1px solid #d5dfe5; border-radius: 3px; }
  fieldset.opcoes legend { color: #1e3287; padding: 0 6px; font-size: 14px; }
  .opcoes .grupo { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 8px; }
  .opcoes label { cursor: pointer; }
  .opcoes .campo { margin: 6px 0; }
  .opcoes select {
    font: inherit; font-size: 16px; padding: 5px 6px; margin-left: 6px; max-width: 100%;
    border: 1px solid #8e8f8f; border-radius: 2px; background: linear-gradient(#fff, #ececec);
  }
  .opcoes small { display: block; color: #6a7480; font-size: 12px; margin-top: 3px; line-height: 1.35; }
  .opcoes .zip { margin-top: 8px; padding: 7px 9px; background: #fffbe6; border: 1px solid #ecd983; border-radius: 3px; font-size: 13px; }
  .opcoes input[type=radio], .opcoes input[type=checkbox] { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }

  .progresso { margin-top: 16px; }
  .progresso .linha-p { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: #333; margin-bottom: 5px; }
  .progresso .linha-p span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra {
    position: relative; height: 20px; border: 1px solid #7d8b99; border-radius: 3px; overflow: hidden;
    background: linear-gradient(#e4e4e4, #f7f7f7 60%, #fff); box-shadow: inset 0 1px 2px rgba(0,0,0,.15);
  }
  .barra i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; display: block; overflow: hidden;
    background: linear-gradient(#b6f2ba, #3fcd4c 46%, #1ea92c 50%, #44d853);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.55);
    transition: width .4s ease;
  }
  .barra i::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
    animation: brilho 1.6s linear infinite;
  }
  .barra.indef i { width: 32%; transition: none; animation: vai 1.5s ease-in-out infinite alternate; }
  @keyframes brilho { to { left: 110%; } }
  @keyframes vai { from { left: 0; } to { left: 68%; } }
  .progresso .btn { margin-top: 10px; }

  .msg { margin-top: 14px; font-size: 14px; line-height: 1.4; }
  .msg:empty { display: none; }
  .msg.erro, .msg.ok, .msg.info { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 3px; border: 1px solid; }
  .msg.erro { background: #fff3f1; border-color: #e3a79c; color: #7a1d0f; }
  .msg.ok { background: #f0fbf1; border-color: #9bd3a1; color: #15561d; }
  .msg.info { background: #f1f7fd; border-color: #b4d0ea; color: #1d3f63; }
  .msg .sinal { flex: none; width: 22px; height: 22px; border-radius: 50%; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; line-height: 1; }
  .msg.erro .sinal { background: radial-gradient(circle at 40% 30%, #ff9a85, #d6301a 60%, #a31c08); }
  .msg.ok .sinal { background: radial-gradient(circle at 40% 30%, #9be8a2, #2fae3c 60%, #1b7a26); }
  .msg.info .sinal { background: radial-gradient(circle at 40% 30%, #9cd3ff, #2a82d6 60%, #1b5ea0); }
  .msg details { margin-top: 6px; font-size: 12px; color: #555; }
  .msg details code { display: block; margin-top: 4px; padding: 6px; background: #fff; border: 1px solid #ddd; overflow-wrap: anywhere; font-family: Consolas, monospace; }

  .resultado { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .resultado .btn { min-height: 40px; }
  .nota { margin: 16px 0 0; padding-top: 10px; border-top: 1px solid #e1e7ee; color: #6a7480; font-size: 12px; line-height: 1.5; }

  /* ---------- barra de tarefas ---------- */
  .barra-tarefas {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    height: calc(44px + var(--safe-b)); padding: 0 8px var(--safe-b) 6px;
    display: flex; align-items: center; gap: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.05) 45%, rgba(0,0,0,.12) 50%, rgba(0,0,0,.25)), var(--vidro-forte);
    backdrop-filter: blur(14px) saturate(1.5);
    -webkit-backdrop-filter: blur(14px) saturate(1.5);
    border-top: 1px solid rgba(255,255,255,.65);
    box-shadow: 0 -1px 0 rgba(0,0,0,.4);
  }
  .orb {
    all: unset; box-sizing: border-box; cursor: pointer; flex: none;
    width: 54px; height: 54px; margin-top: -12px; border-radius: 50%;
    background: radial-gradient(circle at 50% 22%, #c4f0ff 0, #4fb2f0 30%, #1a6fc4 62%, #0a3f86 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.6), 0 0 0 3px rgba(10,40,90,.6), 0 0 14px rgba(110,190,255,.9);
    display: grid; place-items: center;
  }
  .orb svg { width: 26px; height: 26px; filter: drop-shadow(0 1px 2px rgba(0,30,90,.8)); }
  .orb:hover { filter: brightness(1.15); }
  .orb:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .tb {
    all: unset; box-sizing: border-box; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 14px; min-width: 120px; border-radius: 4px; font-size: 14px;
    border: 1px solid rgba(255,255,255,.4);
    background: linear-gradient(rgba(255,255,255,.28), rgba(255,255,255,.07) 50%, rgba(255,255,255,.03) 52%, rgba(255,255,255,.14));
    text-shadow: 0 1px 2px rgba(0,20,60,.8);
  }
  .tb svg { width: 20px; height: 20px; flex: none; }
  .tb:hover { background: linear-gradient(rgba(255,255,255,.45), rgba(255,255,255,.15) 50%, rgba(255,255,255,.08) 52%, rgba(255,255,255,.3)); }
  .tb[aria-current="true"] {
    border-color: rgba(255,255,255,.8);
    background: linear-gradient(rgba(255,255,255,.5), rgba(160,215,255,.28) 50%, rgba(120,190,250,.2) 52%, rgba(190,230,255,.4));
    box-shadow: inset 0 0 10px rgba(170,225,255,.9);
  }
  .tb:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  .bandeja { margin-left: auto; color: #fff; text-align: center; font-size: 12px; line-height: 1.25; text-shadow: 0 1px 2px rgba(0,20,60,.8); padding-left: 10px; }

  .menu {
    position: fixed; left: 8px; bottom: calc(52px + var(--safe-b)); z-index: 30; width: min(300px, calc(100vw - 16px));
    border-radius: 8px; padding: 10px; color: #fff; text-shadow: 0 1px 3px rgba(0,30,80,.7);
    background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.1)), var(--vidro-forte);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.7); box-shadow: 0 10px 34px rgba(0,25,70,.55);
  }
  .menu h3 { margin: 6px 4px; font-size: 12px; font-weight: 400; opacity: .9; text-transform: uppercase; letter-spacing: .04em; }
  .menu .temas { display: flex; gap: 10px; padding: 4px; }
  .menu .temas button {
    all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 6px; border: 2px solid rgba(255,255,255,.7);
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .menu .temas button[aria-pressed="true"] { outline: 2px solid #fff; outline-offset: 2px; }
  .menu .temas button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .menu p { margin: 6px 4px 2px; font-size: 12px; line-height: 1.45; }

  /* ---------- celular ---------- */
  @media (max-width: 899px) {
    .area { grid-template-columns: minmax(0, 1fr); padding: 12px 10px calc(78px + var(--safe-b)); }
    .gadgets { display: none; }
    .cliente { padding: 14px 14px 12px; }
    .cliente h1 { font-size: 19px; }
    .btn { min-height: 44px; }
    .acoes .btn { flex: 1; }
    .endereco .btn { min-height: 0; }
    .preview { align-items: flex-start; }
    .preview img { width: 96px; height: 54px; }
    .tb { flex: 1; min-width: 0; justify-content: center; padding: 0 6px; font-size: 13px; }
    .tb svg { width: 18px; height: 18px; }
  }
  @media (max-width: 460px) {
    .bandeja { display: none; }
    .tb span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  }
  @media (prefers-reduced-motion: reduce) {
    .barra i::after, .barra.indef i { animation: none; }
  }
</style>
</head>
<body>

<!-- cenário (desenho próprio) -->
<svg class="cenario" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a5fc4"/><stop offset=".45" stop-color="#2f93e6"/>
      <stop offset=".78" stop-color="#9cd5fa"/><stop offset="1" stop-color="#dff3ff"/>
    </linearGradient>
    <radialGradient id="sol" cx="78%" cy="14%" r="55%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".25" stop-color="#cfeaff" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lago" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6f5"/><stop offset=".5" stop-color="#3a9fe0"/><stop offset="1" stop-color="#0e5fb0"/>
    </linearGradient>
    <linearGradient id="mont1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fa8d0"/><stop offset="1" stop-color="#4f86b8"/></linearGradient>
    <linearGradient id="mont2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f9a5c"/><stop offset="1" stop-color="#1f6a40"/></linearGradient>
    <linearGradient id="folha" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fe05a"/><stop offset="1" stop-color="#1f8a2e"/></linearGradient>
    <filter id="desf"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#ceu)"/>
  <rect width="1600" height="900" fill="url(#sol)"/>
  <g fill="#fff" filter="url(#desf)" opacity=".55">
    <ellipse cx="300" cy="170" rx="190" ry="34"/><ellipse cx="520" cy="205" rx="150" ry="26"/>
    <ellipse cx="1100" cy="280" rx="220" ry="30"/><ellipse cx="1380" cy="120" rx="150" ry="24"/>
  </g>
  <path d="M0 560 L140 500 L260 545 L420 470 L560 540 L700 495 L860 560 L1000 485 L1180 550 L1320 505 L1460 555 L1600 500 L1600 640 L0 640Z" fill="url(#mont1)" opacity=".85"/>
  <path d="M0 610 C180 540 300 600 470 585 C650 570 740 625 900 600 C1100 568 1240 610 1380 590 C1480 578 1550 596 1600 590 L1600 660 L0 660Z" fill="url(#mont2)"/>
  <rect y="640" width="1600" height="260" fill="url(#lago)"/>
  <g stroke="#fff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round">
    <path d="M200 700 h120"/><path d="M520 730 h180"/><path d="M900 690 h140"/><path d="M1200 745 h200"/><path d="M60 800 h160"/><path d="M700 820 h220"/><path d="M1350 830 h150"/>
  </g>
  <path d="M0 640 h1600" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
  <g>
    <path d="M-20 900 C20 780 90 740 160 700 C130 780 110 840 90 900Z" fill="url(#folha)"/>
    <path d="M30 900 C60 810 130 770 230 760 C190 820 150 860 130 900Z" fill="url(#folha)" opacity=".9"/>
    <path d="M1620 900 C1580 800 1520 760 1450 740 C1480 810 1500 860 1520 900Z" fill="url(#folha)"/>
    <path d="M1560 900 C1550 830 1500 800 1420 790 C1450 840 1470 870 1480 900Z" fill="url(#folha)" opacity=".9"/>
  </g>
</svg>

<!-- ícones -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#bfe3ff"/></linearGradient>
  </defs>
  <symbol id="i-social" viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="3" fill="url(#gi)" stroke="#1b5ea0" stroke-width="1.4"/><circle cx="12" cy="11" r="3.4" fill="#2a82d6" stroke="#1b5ea0"/><circle cx="12" cy="18.2" r="1" fill="#1b5ea0"/></symbol>
  <symbol id="i-tv" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2" fill="url(#gi)" stroke="#1b5ea0" stroke-width="1.4"/><path d="M10 8l5 2.5-5 2.5z" fill="#d6301a"/><path d="M8 21h8M12 17v4" stroke="#1b5ea0" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="i-nota" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="url(#gi)" stroke="#1b5ea0" stroke-width="1.4"/><path d="M10 16.5V7.2l5-1.2v8.5" fill="none" stroke="#1b5ea0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.6" cy="16.6" r="1.9" fill="#2a82d6" stroke="#1b5ea0"/><circle cx="13.6" cy="14.6" r="1.9" fill="#2a82d6" stroke="#1b5ea0"/></symbol>
  <symbol id="i-seta" viewBox="0 0 24 24"><path d="M12 3v11m0 0l-4.5-4.5M12 14l4.5-4.5M5 19h14" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="area">
  <aside class="gadgets" aria-label="Painéis">
    <section class="gadget">
      <h2>Tarefas</h2>
      <ul id="g-nav"></ul>
    </section>
    <section class="gadget relogio" aria-label="Relógio">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="47" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.9)" stroke-width="2.5"/>
        <circle cx="50" cy="50" r="42" fill="rgba(30,110,200,.55)"/>
        <g id="ticks" stroke="#fff" stroke-width="1.6" stroke-linecap="round"></g>
        <line id="h-h" x1="50" y1="50" x2="50" y2="28" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
        <line id="h-m" x1="50" y1="50" x2="50" y2="18" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
        <line id="h-s" x1="50" y1="56" x2="50" y2="14" stroke="#bfe8ff" stroke-width="1"/>
        <circle cx="50" cy="50" r="2.6" fill="#fff"/>
      </svg>
      <div class="hora" id="g-hora">--:--</div>

<nav class="barra-tarefas" aria-label="Barra de tarefas">
  <button class="orb" id="orb" aria-label="Menu" aria-expanded="false" aria-controls="menu"><svg><use href="#i-seta"/></svg></button>
  <div id="tb"></div>
  <div class="bandeja" aria-hidden="true"><div id="t-hora">--:--</div><div id="t-data"></div></div>

<div class="menu" id="menu" hidden>
  <h3>Cor da janela</h3>
  <div class="temas">
    <button type="button" data-tema="azul" aria-label="Azul" style="background:linear-gradient(#bfe3ff,#4a9be0)"></button>
    <button type="button" data-tema="roxo" aria-label="Roxo" style="background:linear-gradient(#e6cdf5,#9a64c8)"></button>
    <button type="button" data-tema="verde" aria-label="Verde" style="background:linear-gradient(#c9f2d1,#4cae68)"></button>
  </div>
  <h3>Sobre</h3>
  <p>Baixe vídeos e músicas de TikTok, Instagram, YouTube e Spotify. Use só conteúdo seu, livre ou com permissão de quem criou.</p>
</div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  const FONTES = {
    social: {
      aba: "Redes", titulo: "Redes sociais", icone: "i-social",
      cab: "Baixar vídeo do TikTok ou Instagram", sub: "Cole o link e baixe em HD, sem marca d'água.",
      rotulo: "Link do vídeo", placeholder: "Cole o link do TikTok ou do Instagram", buscar: false,
      nota: "Funciona com posts públicos. O TikTok vem sem marca d'água quando disponível; o Instagram já vem limpo. Use apenas com conteúdo seu ou com permissão de quem criou."
    },
    youtube: {
      aba: "YouTube", titulo: "YouTube", icone: "i-tv",
      cab: "Baixar do YouTube", sub: "Vídeo em MP4 ou áudio em MP3. Playlists viram um arquivo ZIP.",
      rotulo: "Link do vídeo ou da playlist", placeholder: "Cole o link do YouTube", buscar: true,
      nota: "Playlists são entregues em um arquivo ZIP, com os arquivos numerados. Use só com conteúdo seu, livre ou com permissão do autor."
    },
    spotify: {
      aba: "Spotify", titulo: "Spotify", icone: "i-nota",
      cab: "Baixar do Spotify em MP3", sub: "Músicas, álbuns e playlists inteiros (álbum e playlist viram ZIP).",
      rotulo: "Link da música, álbum ou playlist", placeholder: "Cole o link do Spotify", buscar: true,
      nota: "O Spotify protege o áudio dele, então este site procura cada música no YouTube e baixa de lá. A versão pode ser diferente da do Spotify (ao vivo, outra gravação). Use só para músicas que você tem direito de baixar."
    }
  };
  const ORDEM = ["social", "youtube", "spotify"];
  const ROTULO_ALTURA = { 2160: "2160p (4K)", 1440: "1440p (2K)", 1080: "1080p (Full HD)", 720: "720p (HD)", 480: "480p", 360: "360p", 240: "240p", 144: "144p" };
  const BITRATES = [[320, "320 kbps (máxima)"], [256, "256 kbps"], [192, "192 kbps (boa)"], [128, "128 kbps (menor arquivo)"]];
  const LIMITE_BLOB = 120 * 1024 * 1024;

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (_) {} };
  const ler = k => { try { return localStorage.getItem(k); } catch (_) { return null; } };
  const dur = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
  const tam = b => b >= 1073741824 ? (b / 1073741824).toFixed(2) + " GB" : b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";

  const paineis = {};

  /* ---------- montagem ---------- */
  function htmlOpcoes(f) {
    const opBit = BITRATES.map(([v, t], i) => `<option value="${v}"${i === 2 ? " selected" : ""}>${t}</option>`).join("");
    const nBit = `<small>O YouTube guarda o áudio em cerca de 128–160 kbps. Escolher 320 não deixa melhor que o original, só aumenta o arquivo.</small>`;
    if (f === "youtube") return `
      <legend>Opções</legend>
      <div class="grupo">
        <label><input type="radio" name="tipo-${f}" value="video" checked>Vídeo (MP4)</label>
        <label><input type="radio" name="tipo-${f}" value="audio">Só áudio (MP3)</label>
      </div>
      <div class="campo c-altura"><label>Resolução <select class="sel-altura"></select></label></div>
      <div class="campo c-bitrate" hidden><label>Qualidade do áudio <select class="sel-bitrate">${opBit}</select></label>${nBit}</div>
      <label class="campo c-playlist" hidden><input type="checkbox" class="chk-playlist">Baixar a playlist inteira (ZIP)</label>
      <div class="zip" hidden></div>`;
    return `
      <legend>Opções</legend>
      <div class="campo"><label>Qualidade do MP3 <select class="sel-bitrate">${opBit}</select></label>${nBit}</div>
      <div class="zip" hidden></div>`;
  }

  function criarPainel(f) {
    const c = FONTES[f];
    const sec = document.createElement("section");
    sec.className = "janela"; sec.id = "j-" + f; sec.hidden = true;
    sec.setAttribute("aria-label", c.titulo);
    sec.innerHTML = `
      <header class="titulo">
        <svg class="ico"><use href="#${c.icone}"/></svg>
        <span class="nome">${esc(c.titulo)} - Baixador</span>
        <span class="caixas" aria-hidden="true"><b class="cx">&#8211;</b><b class="cx">&#9633;</b><b class="cx fechar">&#10005;</b></span>
      </header>
      <div class="cliente">
        <h1>${esc(c.cab)}</h1>
        <p class="sub">${esc(c.sub)}</p>
        <form class="form" novalidate>
          <label class="rotulo" for="url-${f}">${esc(c.rotulo)}</label>
          <div class="endereco">
            <input id="url-${f}" class="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(c.placeholder)}">
            <button type="button" class="btn b-colar">Colar</button>
          </div>
          <div class="acoes">
            ${c.buscar ? '<button type="submit" class="btn principal b-buscar">Buscar</button><button type="button" class="btn b-baixar" disabled>Baixar</button>'
                       : '<button type="submit" class="btn principal b-baixar">Baixar</button>'}
          </div>
        </form>
        <div class="preview" hidden><img alt="" referrerpolicy="no-referrer"><div class="tx"><div class="t"></div><div class="m"></div></div></div>
        <fieldset class="opcoes" hidden>${htmlOpcoes(f)}</fieldset>
        <div class="progresso" hidden>
          <div class="linha-p"><span class="p-txt">Preparando...</span><span class="p-pct"></span></div>
          <div class="barra indef"><i></i></div>
          <button type="button" class="btn b-cancelar">Cancelar</button>
        </div>
        <div class="msg" role="status" aria-live="polite"></div>
        <div class="resultado" hidden>
          <a class="btn principal r-baixar" href="#" download>Baixar arquivo</a>
          <button type="button" class="btn r-salvar" hidden>Salvar no celular</button>
        </div>
        <p class="nota">${esc(c.nota)}</p>
      </div>`;
    $("#janelas").appendChild(sec);
    const p = { f, el: sec, info: null, jobId: null, timer: null, blobUrl: null, arquivo: null };
    p.q = s => $(s, sec);
    paineis[f] = p;
    ligar(p);
  }

  function ligar(p) {
    const c = FONTES[p.f];
    p.q(".b-colar").addEventListener("click", async () => {
      try { p.q(".url").value = (await navigator.clipboard.readText()).trim(); p.q(".url").focus(); resetInfo(p); }
      catch (_) { msg(p, "info", "Não consegui acessar a área de transferência. Toque e segure no campo e escolha Colar."); }
    });
    p.q(".url").addEventListener("input", () => resetInfo(p));
    p.q(".form").addEventListener("submit", ev => { ev.preventDefault(); c.buscar ? buscar(p) : baixar(p); });
    p.q(".b-baixar").addEventListener("click", () => { if (c.buscar) baixar(p); });
    p.q(".b-cancelar").addEventListener("click", () => cancelar(p));
    p.q(".fechar").addEventListener("click", () => limpar(p));
    $$('input[type=radio]', p.el).forEach(r => r.addEventListener("change", () => atualizarOpcoes(p)));
    const chk = p.q(".chk-playlist"); if (chk) chk.addEventListener("change", () => atualizarOpcoes(p));
    p.q(".r-salvar").addEventListener("click", async () => {
      if (!p.arquivo) return;
      try { await navigator.share({ files: [p.arquivo] }); } catch (e) { if (e && e.name !== "AbortError") p.q(".r-baixar").click(); }
    });
  }

  /* ---------- estado visual ---------- */
  function msg(p, tipo, texto, detalhe) {
    const m = p.q(".msg");
    if (!texto) { m.className = "msg"; m.innerHTML = ""; return; }
    const sinal = { erro: "&#10005;", ok: "&#10003;", info: "i" }[tipo] || "i";
    m.className = "msg " + tipo;
    m.innerHTML = `<span class="sinal" aria-hidden="true">${sinal}</span><div>${esc(texto)}${detalhe ? `<details><summary>Detalhe técnico</summary><code>${esc(detalhe)}</code></details>` : ""}</div>`;
  }
  function resetInfo(p) {
    if (p.jobId) return;
    p.info = null;
    p.q(".preview").hidden = true; p.q(".opcoes").hidden = true; p.q(".resultado").hidden = true;
    msg(p, "", "");
    if (FONTES[p.f].buscar) p.q(".b-baixar").disabled = true;
  }
  function limpar(p) {
    cancelar(p, true);
    p.q(".url").value = ""; resetInfo(p); p.q(".progresso").hidden = true;
    liberarBlob(p);
  }
  function liberarBlob(p) { if (p.blobUrl) { URL.revokeObjectURL(p.blobUrl); p.blobUrl = null; } p.arquivo = null; }
  function ocupado(p, sim) {
    $$("button.btn:not(.b-cancelar), input", p.el).forEach(e => { if (!e.classList.contains("fechar")) e.disabled = sim; });
    if (!sim && FONTES[p.f].buscar) p.q(".b-baixar").disabled = !p.info;
    if (!sim && p.info) atualizarOpcoes(p);
  }

  function atualizarOpcoes(p) {
    const info = p.info; if (!info) return;
    const tipo = p.f === "youtube" ? ($('input[type=radio]:checked', p.el) || {}).value : "audio";
    const ca = p.q(".c-altura"), cb = p.q(".c-bitrate");
    if (ca) ca.hidden = tipo !== "video";
    if (cb) cb.hidden = tipo !== "audio";
    const chk = p.q(".chk-playlist"), cp = p.q(".c-playlist");
    if (cp) {
      cp.hidden = !(info.tipo === "video" && info.tem_playlist) && info.tipo !== "playlist";
      if (info.tipo === "playlist") { chk.checked = true; chk.disabled = true; }
    }
    const lista = info.tipo === "playlist" || info.tipo === "album" || (chk && chk.checked && !cp.hidden);
    const z = p.q(".zip");
    if (lista) {
      const lim = tipo === "video" ? info.limite_video : info.limite_audio;
      const n = info.itens != null ? info.itens + (info.itens_truncado ? "+" : "") : "?";
      let t = `Isto vai virar um arquivo ZIP com até ${lim} itens (a lista tem ${n}).`;
      if (tipo === "video") t += " Para playlists de vídeo o limite é menor, porque os arquivos são grandes.";
      z.textContent = t; z.hidden = false;
    } else z.hidden = true;
  }

  function preencher(p, d) {
    const pv = p.q(".preview");
    const img = $("img", pv);
    pv.classList.toggle("quadrado", d.fonte === "spotify");
    if (d.capa) { img.src = d.capa; img.hidden = false; } else { img.removeAttribute("src"); img.hidden = true; }
    $(".t", pv).textContent = d.titulo || "";
    let m = "";
    if (d.fonte === "youtube") {
      m = d.tipo === "playlist" ? `Playlist • ${d.itens}${d.itens_truncado ? "+" : ""} vídeos` : `Vídeo • ${dur(d.duracao)}`;
      if (d.autor) m += " • " + d.autor;
    } else {
      const nome = { track: "Música", album: "Álbum", playlist: "Playlist" }[d.tipo];
      m = d.tipo === "track" ? `${nome}${d.autor ? " • " + d.autor : ""}` : `${nome} • ${d.itens} músicas`;
    }
    $(".m", pv).textContent = m;
    pv.hidden = false;
    const sa = p.q(".sel-altura");
    if (sa) {
      const alturas = (d.alturas && d.alturas.length ? d.alturas : [1080, 720, 480, 360]);
      sa.innerHTML = alturas.map(h => `<option value="${h}">${ROTULO_ALTURA[h] || h + "p"}</option>`).join("");
      const pad = alturas.includes(1080) ? 1080 : alturas[0]; sa.value = pad;
    }
    const chk = p.q(".chk-playlist"); if (chk) { chk.checked = false; chk.disabled = false; }
    p.q(".opcoes").hidden = false;
    atualizarOpcoes(p);
  }

  /* ---------- chamadas ---------- */
  async function api(url, corpo) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpo || {}) });
    let d = {}; try { d = await r.json(); } catch (_) {}
    return { ok: r.ok, status: r.status, d };
  }

  async function buscar(p) {
    const url = p.q(".url").value.trim();
    if (!url) return msg(p, "info", "Cole um link primeiro.");
    resetInfo(p); msg(p, "info", "Buscando informações...");
    ocupado(p, true);
    try {
      const { ok, d } = await api("/api/info", { url, fonte: p.f });
      if (!ok) {
        if (d.fonte_certa && paineis[d.fonte_certa]) {
          const alvo = paineis[d.fonte_certa]; alvo.q(".url").value = url; resetInfo(alvo);
          ir(d.fonte_certa); msg(alvo, "info", "Esse link é de " + FONTES[d.fonte_certa].titulo + ". Mudei para a aba certa; toque em Buscar.");
          msg(p, "", ""); return;
        }
        return msg(p, "erro", d.erro || "Não consegui ler esse link.", d.detalhe);
      }
      p.info = d; msg(p, "", ""); preencher(p, d);
    } catch (_) {
      msg(p, "erro", "Sem conexão com o servidor. Se o site estava parado, espere 1 minuto e tente de novo.");
    } finally { ocupado(p, false); }
  }

  async function baixar(p) {
    const url = p.q(".url").value.trim();
    if (!url) return msg(p, "info", "Cole um link primeiro.");
    const tipoSel = p.f === "youtube" ? ($('input[type=radio]:checked', p.el) || {}).value : (p.f === "spotify" ? "audio" : "video");
    const chk = p.q(".chk-playlist");
    const corpo = {
      url, fonte: p.f, tipo: tipoSel || "video",
      altura: +(p.q(".sel-altura") || {}).value || 1080,
      bitrate: +(p.q(".sel-bitrate") || {}).value || 192,
      playlist: !!(chk && chk.checked)
    };
    liberarBlob(p); p.q(".resultado").hidden = true; msg(p, "", "");
    ocupado(p, true);
    try {
      const { ok, d } = await api("/api/jobs", corpo);
      if (!ok) { ocupado(p, false); return msg(p, "erro", d.erro || "Não consegui iniciar o download."); }
      p.jobId = d.id; mostrarProgresso(p, { status: "fila" }); acompanhar(p, d.id);
    } catch (_) {
      ocupado(p, false); msg(p, "erro", "Sem conexão com o servidor. Se o site estava parado, espere 1 minuto e tente de novo.");
    }
  }

  async function cancelar(p, silencioso) {
    const id = p.jobId; if (!id) return;
    try { await api(`/api/jobs/${id}/cancelar`); } catch (_) {}
    if (silencioso) { p.jobId = null; clearTimeout(p.timer); ocupado(p, false); }
  }

  function mostrarProgresso(p, s) {
    const box = p.q(".progresso"); box.hidden = false;
    const barra = $(".barra", box), fill = $("i", barra);
    let txt = "", pct = "";
    if (s.status === "fila") { txt = "Na fila..."; barra.classList.add("indef"); }
    else if (s.status === "preparando") { txt = "Preparando..."; barra.classList.add("indef"); }
    else if (s.status === "zipando") { txt = "Criando o arquivo ZIP..."; barra.classList.add("indef"); }
    else if (s.status === "baixando") {
      barra.classList.remove("indef");
      const total = Math.max(1, s.total || 1);
      const geral = Math.min(100, ((Math.max(0, (s.atual || 1) - 1) + (s.pct || 0) / 100) / total) * 100);
      fill.style.width = geral.toFixed(1) + "%";
      pct = Math.floor(geral) + "%";
      txt = total > 1 ? `Baixando ${s.atual} de ${total}${s.titulo ? ": " + s.titulo : ""}` : `Baixando${s.titulo ? ": " + s.titulo : "..."}`;
    }
    $(".p-txt", box).textContent = txt; $(".p-txt", box).title = txt; $(".p-pct", box).textContent = pct;
    if (s.status !== "baixando") fill.style.width = "";
  }

  function acompanhar(p, id) {
    let falhas = 0;
    const tick = async () => {
      if (p.jobId !== id) return;
      try {
        const r = await fetch(`/api/jobs/${id}`);
        if (r.status === 404) { fim(p); return msg(p, "erro", "O download expirou. Tente de novo."); }
        const s = await r.json(); falhas = 0;
        if (["pronto", "erro", "cancelado"].includes(s.status)) { fim(p); return concluir(p, s); }
        mostrarProgresso(p, s);
      } catch (_) {
        if (++falhas >= 6) { fim(p); return msg(p, "erro", "Perdi a conexão com o servidor."); }
      }
      p.timer = setTimeout(tick, 1000);
    };
    tick();
  }
  function fim(p) { clearTimeout(p.timer); p.jobId = null; p.q(".progresso").hidden = true; ocupado(p, false); }

  async function concluir(p, s) {
    if (s.status === "cancelado") return msg(p, "info", "Download cancelado.");
    if (s.status === "erro") return msg(p, "erro", s.erro || "Não consegui baixar.", s.detalhe);
    let texto = `Pronto! ${s.nome} (${tam(s.tamanho)})`;
    if (s.lista) texto += s.falhas ? ` Alguns itens falharam (${s.falhas}); veja o FALHAS.txt dentro do ZIP.` : "";
    if (s.aviso) texto += " " + s.aviso;
    msg(p, "ok", texto);
    const a = p.q(".r-baixar"), salvar = p.q(".r-salvar"), box = p.q(".resultado");
    const href = `/api/jobs/${s.id}/arquivo`;
    a.href = href; a.download = s.nome; a.textContent = "Baixar arquivo"; salvar.hidden = true; box.hidden = false;
    const toque = matchMedia("(pointer: coarse)").matches;
    if (toque && navigator.canShare && !s.lista && s.tamanho <= LIMITE_BLOB) {
      a.textContent = "Preparando...";
      try {
        const r = await fetch(href); const blob = await r.blob();
        const arq = new File([blob], s.nome, { type: blob.type || (s.tipo === "audio" ? "audio/mpeg" : "video/mp4") });
        p.arquivo = arq; p.blobUrl = URL.createObjectURL(blob); a.href = p.blobUrl;
        if (navigator.canShare({ files: [arq] })) salvar.hidden = false;
      } catch (_) {}
      a.textContent = "Baixar arquivo";
    } else if (!toque) {
      a.click();
    }
  }

  /* ---------- navegação ---------- */
  function ir(f) {
    ORDEM.forEach(k => {
      paineis[k].el.hidden = k !== f;
    });
    $$("[data-ir]").forEach(b => b.setAttribute("aria-current", b.dataset.ir === f ? "true" : "false"));
    guardar("aba", f);
    if (location.hash !== "#" + f) history.replaceState(null, "", "#" + f);
    $("#menu").hidden = true; $("#orb").setAttribute("aria-expanded", "false");
  }

  function montarNavegacao() {
    $("#g-nav").innerHTML = ORDEM.map(f => `<li><button type="button" data-ir="${f}"><svg class="ic"><use href="#${FONTES[f].icone}"/></svg>${esc(FONTES[f].titulo)}</button></li>`).join("");
    $("#tb").style.display = "contents";
    $("#tb").innerHTML = ORDEM.map(f => `<button type="button" class="tb" data-ir="${f}"><svg><use href="#${FONTES[f].icone}"/></svg><span>${esc(FONTES[f].aba)}</span></button>`).join("");
    $$("[data-ir]").forEach(b => b.addEventListener("click", () => ir(b.dataset.ir)));
  }

  /* ---------- menu e tema ---------- */
  function tema(t) {
    document.documentElement.dataset.tema = t;
    const cor = { azul: "#2a78c0", roxo: "#7a4aa8", verde: "#2f8a4c" }[t];
    $('meta[name="theme-color"]').setAttribute("content", cor);
    $$(".temas button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tema === t ? "true" : "false"));
    guardar("tema", t);
  }
  $("#orb").addEventListener("click", ev => {
    ev.stopPropagation();
    const m = $("#menu"); m.hidden = !m.hidden; $("#orb").setAttribute("aria-expanded", String(!m.hidden));
  });
  document.addEventListener("click", ev => { if (!ev.target.closest("#menu")) { $("#menu").hidden = true; $("#orb").setAttribute("aria-expanded", "false"); } });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") { $("#menu").hidden = true; $("#orb").setAttribute("aria-expanded", "false"); } });
  $$(".temas button").forEach(b => b.addEventListener("click", () => tema(b.dataset.tema)));

  /* ---------- relógio ---------- */
  (function () {
    const g = $("#ticks");
    for (let i = 0; i < 12; i++) {
      const a = i * Math.PI / 6, r1 = i % 3 ? 38 : 35, r2 = 41;
      g.insertAdjacentHTML("beforeend", `<line x1="${50 + r1 * Math.sin(a)}" y1="${50 - r1 * Math.cos(a)}" x2="${50 + r2 * Math.sin(a)}" y2="${50 - r2 * Math.cos(a)}"/>`);
    }
  })();
  function relogio() {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
    const dt = d.toLocaleDateString("pt-BR");
    $("#g-hora").textContent = hh + ":" + mm; $("#t-hora").textContent = hh + ":" + mm;
    $("#g-data").textContent = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    $("#t-data").textContent = dt;
    const s = d.getSeconds(), m = d.getMinutes() + s / 60, h = (d.getHours() % 12) + m / 60;
    $("#h-s").setAttribute("transform", `rotate(${s * 6} 50 50)`);
    $("#h-m").setAttribute("transform", `rotate(${m * 6} 50 50)`);
    $("#h-h").setAttribute("transform", `rotate(${h * 30} 50 50)`);
  }
  relogio(); setInterval(relogio, 1000);

  /* ---------- gadget de sistema ---------- */
  fetch("/saude").then(r => r.json()).then(s => {
    const lin = (nome, ok, txt) => `<div class="linha"><span>${nome}</span><span class="${ok ? "ok" : "no"}">${txt}</span></div>`;
    $("#g-sistema").innerHTML =
      lin("Conversor (ffmpeg)", s.ffmpeg, s.ffmpeg ? "OK" : "ausente") +
      lin("Motor JS (YouTube)", s.js_runtime, s.js_runtime ? "OK" : "ausente") +
      lin("Cookies YouTube", s.cookies, s.cookies ? "sim" : "não") +
      `<div class="linha"><span>yt-dlp</span><span>${esc(s.yt_dlp)}</span></div>` +
      `<div class="linha"><span>Limite</span><span>${s.limites.musicas_por_zip} músicas / ${s.limites.videos_por_zip} vídeos</span></div>`;
  }).catch(() => { $("#g-sistema").innerHTML = '<div class="linha">Sem resposta do servidor</div>'; });

  /* ---------- início ---------- */
  ORDEM.forEach(criarPainel);
  montarNavegacao();
  tema(["azul", "roxo", "verde"].includes(ler("tema")) ? ler("tema") : "azul");
  const inicial = [location.hash.slice(1), ler("aba")].find(x => ORDEM.includes(x)) || "social";
  ir(inicial);
})();
</script>
</body>
</html>
